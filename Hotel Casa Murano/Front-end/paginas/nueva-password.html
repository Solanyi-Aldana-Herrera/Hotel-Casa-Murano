<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva contraseña</title>
</head>
<body>

<h2>Crear nueva contraseña</h2>

<form id="formNuevaPassword">

    <input
        type="password"
        id="contrasena"
        placeholder="Nueva contraseña"
        required
    >

    <button type="submit">
        Guardar
    </button>

</form>

<script>

document
.getElementById('formNuevaPassword')
.addEventListener('submit', async (e) => {

    e.preventDefault();

    const correo =
        localStorage.getItem(
            'correoRecuperacion'
        );

    const contrasena =
        document.getElementById(
            'contrasena'
        ).value;

    const respuesta = await fetch(
        'http://localhost:3000/api/nueva-password',
        {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                correo,
                contrasena
            })
        }
    );

    const datos =
        await respuesta.json();

    alert(datos.mensaje);

    if(datos.success){

        window.location.href =
        'login.html';

    }

});

</script>

</body>
</html>
